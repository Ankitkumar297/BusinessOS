[project]
name = "businessos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "argon2-cffi>=23.1,<24", "fastapi>=0.115,<1",
  "email-validator>=2.2,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "PyJWT>=2.10,<3",
  "redis>=5.2,<6", "reportlab>=4,<5", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = ["httpx2>=2.12,<3", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
